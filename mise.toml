[tools]
rust = { version = "1.95", components = "rustfmt,clippy,rust-src" }

[settings]
experimental = true

# ---------------------------------------------------------------------------
# Tasks — replaces the manual checklist in CLAUDE.md / AGENTS.md
# ---------------------------------------------------------------------------

[tasks.check]
description = "Type and borrow check (fastest gate)"
run = "cargo check --workspace --all-targets"

[tasks.clippy]
description = "Lint with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Auto-fix formatting"
run = "cargo fmt --all"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.build]
description = "Build all targets"
run = "cargo build --workspace"

[tasks."build:release"]
description = "Release build"
run = "cargo build --workspace --release"

[tasks.doc]
description = "Build rustdoc (warnings = errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.ci]
description = "Run full CI pipeline locally"
depends = ["fmt", "clippy", "test", "build", "doc"]

[tasks.lint]
description = "Run fmt + clippy"
depends = ["fmt", "clippy"]

[tasks.precommit]
description = "Pre-commit checks (same as CLAUDE.md checklist)"
depends = ["check", "clippy", "fmt", "test"]

# ---------------------------------------------------------------------------
# Tool binaries
# ---------------------------------------------------------------------------

[tasks.valenc]
description = "Run the Valen compiler"
run = "cargo run -p valenc --"

[tasks.valenfmt]
description = "Run the Valen formatter"
run = "cargo run -p valenfmt --"

[tasks.lsp]
description = "Run the Valen LSP server"
run = "cargo run -p valen-lsp --"

[tasks."stdlib:build"]
description = "Build Valen stdlib to .class files"
run = """
mkdir -p build/stdlib
cargo run -q -p valenc -- build \
  stdlib/valen/core/core.vln \
  stdlib/valen/io/io.vln \
  -o build/stdlib
"""

[tasks."stdlib:check"]
description = "Check Valen stdlib compiles"
run = """
cargo run -q -p valenc -- check \
  stdlib/valen/core/core.vln \
  stdlib/valen/io/io.vln
"""
